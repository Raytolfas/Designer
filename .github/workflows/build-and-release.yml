name: Build and Release Multiplatform

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
        type: string
      create_release:
        description: 'Publish as GitHub Release'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest
          - os: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools

      - name: Install dependencies
        run: npm ci

      - name: Build renderer and main processes
        run: npm run build

      - name: Package with electron-builder (Windows)
        if: runner.os == 'Windows'
        run: npx electron-builder --win
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package with electron-builder (macOS)
        if: runner.os == 'macOS'
        run: npx electron-builder --mac
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package with electron-builder (Linux)
        if: runner.os == 'Linux'
        run: npx electron-builder --linux
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SHA256 checksums (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem -Path dist/* -Include *.exe,*.zip,*.blockmap | ForEach-Object {
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -FilePath dist/SHA256SUMS.txt -Append -Encoding utf8
          }

      - name: Generate SHA256 checksums (Unix)
        if: runner.os != 'Windows'
        run: |
          cd dist
          shasum -a 256 *.dmg *.zip *.AppImage *.deb 2>/dev/null > SHA256SUMS.txt || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: raytolfas-designer-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/SHA256SUMS.txt

  release:
    name: Publish Release
    needs: build
    if: inputs.create_release
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Consolidate release files
        run: |
          mkdir -p release-files
          find artifacts -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.zip" -o -name "*.AppImage" -o -name "*.deb" -o -name "SHA256SUMS.txt" \) -exec cp {} release-files/ \;
          cd release-files
          cat *SHA256SUMS.txt 2>/dev/null | sort -u > ALL_SHA256SUMS.txt || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          files: |
            release-files/*.exe
            release-files/*.dmg
            release-files/*.zip
            release-files/*.AppImage
            release-files/*.deb
            release-files/ALL_SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
